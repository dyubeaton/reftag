services:
  postgres:
    image: postgres:16
    container_name: reftag-postgres
    environment:
      POSTGRES_USER: reftag
      POSTGRES_PASSWORD: reftag_dev_password
      POSTGRES_DB: reftag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reftag -d reftag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: reftag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: