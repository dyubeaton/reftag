services:
  postgres:
    image: postgres:16
    container_name: reftag-postgres
    environment:
      POSTGRES_USER: reftag
      POSTGRES_PASSWORD: reftag_dev_password
      POSTGRES_DB: reftag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reftag -d reftag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: reftag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reftag-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://reftag:reftag_dev_password@postgres:5432/reftag?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: reftag-worker
    environment:
      REDIS_ADDR: "redis:6379"
      BACKEND_URL: "http://backend:8080"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data: